[package]
name = "capi-engine"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "Motor Rust de Capi: catálogo, streaming y letras de YouTube Music"
repository = "https://github.com/jh2929/Capi-Desktop"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
rustypipe = "0.11.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
