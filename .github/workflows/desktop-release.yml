name: Build & Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      release:
        description: "Publish GitHub Release"
        required: false
        type: boolean
        default: true
      tag_name:
        description: "Tag name for release (e.g. v0.2.0)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-windows:
    name: Windows (.msi/.exe)
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'windows'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capi-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: capi-desktop/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci
        working-directory: capi-desktop

      - name: Build Capi Desktop
        run: npm run tauri build
        working-directory: capi-desktop

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: Capi-Windows
          if-no-files-found: error
          path: |
            capi-desktop/src-tauri/target/release/bundle/msi/*.msi
            capi-desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

  desktop-macos:
    name: macOS (.dmg)
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'macos'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capi-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: capi-desktop/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci
        working-directory: capi-desktop

      - name: Build Capi Desktop
        run: npm run tauri build
        working-directory: capi-desktop

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: Capi-macOS
          if-no-files-found: error
          path: capi-desktop/src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30

  desktop-linux:
    name: Linux (.deb/.AppImage/.rpm)
    if: >
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'linux'))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capi-desktop/package-lock.json

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: capi-desktop/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci
        working-directory: capi-desktop

      - name: Build Capi Desktop
        run: npm run tauri build -- --bundles deb,appimage,rpm
        working-directory: capi-desktop

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: Capi-Linux
          if-no-files-found: error
          path: |
            capi-desktop/src-tauri/target/release/bundle/deb/*.deb
            capi-desktop/src-tauri/target/release/bundle/rpm/*.rpm
            capi-desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

  release:
    name: Create GitHub Release
    if: >
      !cancelled() && !contains(needs.*.result, 'failure')
      && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        || (github.event_name == 'workflow_dispatch' && inputs.release == true)
      )
    needs: [desktop-windows, desktop-macos, desktop-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-artifacts
          pattern: "Capi-*"
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name != '' && inputs.tag_name || github.ref_name }}
          files: /tmp/release-artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
